<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0">
<meta name="theme-color" content="#060A1E">
<title>Entre Orillas — El río que nos mueve</title>
<meta name="description" content="Ruta turística y cultural interactiva por los doce planchones del río Sinú en Montería. Una ruta por la memoria, la identidad y la vida del río.">

<!-- Open Graph: la ruta se comparte por QR y por redes -->
<meta property="og:title" content="Entre Orillas — El río que nos mueve">
<meta property="og:description" content="Los doce planchones que conectan las dos márgenes del río Sinú en Montería.">
<meta property="og:type" content="website">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Jost:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- Sin GSAP/ScrollTrigger: el pineado lo hace `position: sticky` nativo,
     y script.js trae su propio motor de progreso (ver "MOTOR DE SCROLL
     NATIVO" dentro del archivo). -->

<link rel="stylesheet" href="styles.css">
<script src="image-slot.js"></script>
</head>
<body>

  <a class="skip-link" href="#main">Saltar al contenido</a>

  <div class="video-stack" id="globalStack" aria-hidden="true"></div>

  <main id="main" class="scroll-track"></main>

  <div class="fg-layer" id="fgLayer" aria-hidden="true">
    <div class="fg-particles" id="fgParticles"></div>
    <div class="fg-grain"></div>
    <div class="fg-vignette"></div>
  </div>

  <header class="site-header">
    <a href="#recorrido" class="brand" id="brandLink" aria-label="Entre Orillas, inicio del recorrido">
      <img class="brand__logo" id="brandLogo" alt="Entre Orillas" hidden>
      <span class="brand__fallback" id="brandFallback">
        <span class="brand__mark" aria-hidden="true"></span>
        <span class="brand__type">Entre&nbsp;Orillas</span>
      </span>
    </a>

    <div class="header-actions">
      <button id="soundToggle" class="icon-btn" type="button" aria-pressed="false" title="Activar el paisaje sonoro del río">
        <span class="icon-btn__on" aria-hidden="true">🔊</span>
        <span class="icon-btn__off" aria-hidden="true">🔇</span>
        <span class="sr-only">Paisaje sonoro del río</span>
      </button>
      <button id="mapToggle" class="icon-btn icon-btn--map" type="button" aria-pressed="false" aria-controls="riverMap" title="Mapa del recorrido">
        <span aria-hidden="true">⌖</span>
        <span class="sr-only">Mapa del recorrido</span>
      </button>
      <button id="a11yToggle" class="icon-btn icon-btn--text" type="button" aria-pressed="false" title="Cambiar a modo accesible: interfaz simplificada con lectura en voz alta">
        <span class="icon-btn__lbl-long">Modo accesible</span>
        <span class="icon-btn__lbl-short" aria-hidden="true">A11Y</span>
      </button>
    </div>
  </header>

  <nav class="river-map" id="riverMap" aria-label="Mapa del recorrido">
    <div class="river-map__head">
      <span class="river-map__title">Los 12 planchones</span>
      <button class="river-map__close" id="mapClose" type="button" aria-label="Cerrar el mapa">✕</button>
    </div>
    <div class="river-map__canvas">
      <svg viewBox="0 0 90 620" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
        <path id="riverTrack" class="river-track"
              d="M45,10 C18,70 72,120 45,180 C18,240 72,290 45,350 C18,410 72,455 45,510 C30,545 52,585 45,610" />
        <path id="riverProgress" class="river-progress"
              d="M45,10 C18,70 72,120 45,180 C18,240 72,290 45,350 C18,410 72,455 45,510 C30,545 52,585 45,610" />
        <g id="riverNodes"></g>
      </svg>
      <ul class="river-list" id="riverList"></ul>
    </div>
  </nav>

  <div class="hud-readout" id="hudReadout" aria-hidden="true">
    <div class="hud-row"><span class="hud-key">COORD</span><span class="hud-val" id="hudCoords">—</span></div>
    <div class="hud-row"><span class="hud-key">ALT</span><span class="hud-val"><span id="hudAlt">0</span> m</span></div>
    <div class="hud-row"><span class="hud-key">RUTA</span><span class="hud-val"><span id="hudProgress">0</span>%</span></div>
    <div class="hud-bar"><span class="hud-bar__fill" id="hudBarFill"></span></div>
  </div>

  <div class="stop-label" id="stopLabel" aria-live="polite"></div>

  <section class="a11y-view" id="a11yView" hidden aria-label="Entre Orillas, versión accesible">
    <div class="a11y-bar">
      <p class="a11y-bar__lead">
        Versión simplificada, sin video ni animación. El contenido se puede leer en voz alta.
      </p>
      <div class="a11y-bar__controls">
        <button id="a11yPlay" type="button" aria-pressed="false">
          <span class="a11y-play-icon" aria-hidden="true">▶</span> Reproducir en voz alta
        </button>
        <button id="a11yStop" type="button">Detener</button>
        <button id="a11yPrev" type="button">← Anterior</button>
        <button id="a11yNext" type="button">Siguiente →</button>
      </div>
      <p class="a11y-bar__status" id="a11yStatus" aria-live="polite"></p>
    </div>
    <nav class="a11y-toc" id="a11yToc" aria-label="Ir a una sección"></nav>
    <div class="a11y-content" id="a11yContent" tabindex="-1"></div>
  </section>

  <audio id="riverAudio" loop preload="none"></audio>

  <div class="plan-detail" id="planDetail" hidden role="dialog" aria-modal="true" aria-label="Ficha ampliada del planchón">
    <button class="plan-detail__close" id="planDetailClose" type="button">
      <span aria-hidden="true">✕</span> Cerrar
    </button>
    <div class="plan-detail__body" id="planDetailBody"></div>
  </div>

  <template id="wireTpl">
    <svg class="wire" viewBox="0 0 400 220" aria-hidden="true">
      <g class="wire-g">
        <path class="wire-path" d="M40,150 L360,150 L340,182 L60,182 Z" />
        <path class="wire-path" d="M40,150 L360,150" />
        <path class="wire-path" d="M70,150 L70,84" />
        <path class="wire-path" d="M150,150 L150,74" />
        <path class="wire-path" d="M250,150 L250,74" />
        <path class="wire-path" d="M330,150 L330,84" />
        <path class="wire-path" d="M55,86 L200,52 L345,86" />
        <path class="wire-path" d="M200,52 L200,64" />
        <path class="wire-path" d="M55,86 L345,86" />
        <path class="wire-path" d="M40,128 L360,128" />
        <path class="wire-path" d="M110,128 L110,150" />
        <path class="wire-path" d="M190,128 L190,150" />
        <path class="wire-path" d="M290,128 L290,150" />
        <circle class="wire-path wire-ring" cx="100" cy="140" r="9" />
        <circle class="wire-path wire-ring" cx="300" cy="140" r="9" />
        <path class="wire-path wire-water" d="M14,196 L386,196" />
      </g>
    </svg>
  </template>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
